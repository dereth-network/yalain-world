# What a plant pollinated with each pollen gives, by a player's guide of 2013 and its chart (reposted in 2016), for the
# nine kinds of seed its author planted: row by row, the planted color, then each pollen. Low confidence: the guide says
# its author grew them a great deal, but gives no counts. Two crosses were recorded in 2017 and agree with the chart;
# they are rows of the dye-plants pack, so this pack leaves them out. Black, pink, orange and clear plants have no row
# here: the guide did not try them.

