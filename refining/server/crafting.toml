# What each refining recipe yields, by its script package: its product and the craft skill level at which it yields
# all it takes (`full_at`). Players measured the line in 2004-05: 34 percent and 0.44 more a level, so all of it at
# 150, at 100, 500 and 2500 units; it gives the 34 of 100 at level 2 recorded twice in 2017, and a guide of 2013 says
# between 34 and 100 percent. The 34 percent is the server's own start, so the rows leave `start` out. Only Steel was
# refined in the recordings, and the players' table is the five traits'; the other five recipes take the same line.
# The others' products are the templates their recipes' own product names name.

