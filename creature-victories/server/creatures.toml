# Creatures that never play their victory over a player they kill: the rabbits' kind (AI superclass 0x1E). 2017's
# recorded players died 12 times to three of its templates and none played it, though their behavior tables name it;
# other kinds without an AI subclass played it after about half. Every template of the kind is here; those no recorded
# player died to are low confidence.

[[creature]]
template = 0x47000828
no_victory = true
prov = { from = "capture", evidence = "AC2-EVID-WDB-CREATURE-VICTORY-2017", ref = "creature 47000828", confidence = "low" }

