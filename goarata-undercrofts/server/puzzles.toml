# The five debris piles: each stands at one of its six places at a time and moves to another now and then, as the
# players' map's six patterns do; edit an authored pack instead.

[[shifting]]
key = "debris-a"
objects = ["debris-a-1@03E6", "debris-a-2@03E6", "debris-a-3@03E6", "debris-a-4@03E6", "debris-a-5@03E6", "debris-a-6@03E6"]
moves_after = 3600
prov = { from = "authored", by = "Dereth Network", note = "the players' map: about forty piles of rock in six patterns, one at random; each pile at its spot in each pattern; the guide: a pile searched twice counts once, so a search leaves it lying", confidence = "low", fields = { moves_after = { from = "authored", by = "Dereth Network", note = "how often the pattern changed is not recorded: an hour", confidence = "low" } } }

