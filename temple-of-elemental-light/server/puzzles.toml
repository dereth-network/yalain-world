open_for = 60
prov = { from = "authored", by = "Dereth Network", note = "lever A in the exit portal's room opens door A (the players' map and its steps; the guide)", confidence = "low", fields = { open_for = { from = "authored", by = "Dereth Network", note = "a minute: no source says; the longest run from a lever to its door is H's, about 290 m (45 s at a run), then C's, about 180 m", confidence = "low" } } }

