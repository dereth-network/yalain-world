# A turret pays each shot's vigor, and uses a shot only when it can pay for it. Its vigor is 80 for each
# level for the bigger kind and 60 for the smaller (its one recording; the two kinds' health stands in the
# same ratio). How fast it comes back is authored: no recording shows a turret's vigor fall or rise. At 6.5
# a second, a full turret of level 39 or more could pay for every shot the twelve turrets recorded in
# January 2017 fired (713 shots, of 1, 20 and 40 vigor each).

