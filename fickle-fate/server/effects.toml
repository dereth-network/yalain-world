# The skill's effect does nothing by its own data: its pick among the fourteen effects (armor, damage, experience,
# health, vigor and their heals, each up or down) was the servers' own code. The install gives each effect its duration
# (900 s up, 300 s down) and its numbers by the skill's level, and each of its 22 skills (one for each class) a range of
# 20 m. Turbine's producer (April 2005) wrote that the effect comes on the user "and their fellowship" at random, "the
# vast majority" good with "occasional negative effects"; nothing gives the chances, so each of the fourteen is as
# likely as another. Fellows share it within the skill's 20 m. No 2017 recording shows the skill used.

[[effect_rule]]
effect = 0x70001EC7
pick = { effects = [
    { effect = 0x70001EC9, weight = 1 },
    { effect = 0x70001ECB, weight = 1 },
    { effect = 0x70001ECD, weight = 1 },
    { effect = 0x70001ED1, weight = 1 },
    { effect = 0x70001ED0, weight = 1 },
    { effect = 0x70001ED5, weight = 1 },
    { effect = 0x70001ED4, weight = 1 },
    { effect = 0x70001EC8, weight = 1 },
    { effect = 0x70001ECA, weight = 1 },
    { effect = 0x70001ECC, weight = 1 },
    { effect = 0x70001ECE, weight = 1 },
    { effect = 0x70001ECF, weight = 1 },
    { effect = 0x70001ED2, weight = 1 },
    { effect = 0x70001ED3, weight = 1 },
], fellows = true, reach = 20 }
prov = { from = "dat", record = 0x70001EC7, confidence = "low", note = "the fourteen effects the install holds for it", fields = { pick = { from = "authored", by = "Dereth Network", confidence = "low", note = "even weights: no source gives the chances; his note names the fellowship; the reach is the skills' own range in the install, 20 m" } } }
