# Each seal lies in one of its two side rooms at a time, and once taken lies in the other a while later; edit an
# authored pack instead.

[[shifting]]
key = "renseloi-seal"
objects = ["renseloi-seal-west@07EF", "renseloi-seal-east@07EF"]
gone_for = 300
prov = { from = "authored", by = "Dereth Network", note = "used up when taken; how soon another lay is in no source, so five minutes", confidence = "low" }

