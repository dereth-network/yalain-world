effect = 0x6F000E95
ward = { effects = [0x700006C6], chance = 1.0 }
prov = { from = "dat", record = 0x6F000E95, confidence = "low", note = "the kind its description gives, always", fields = { ward = { from = "dat", record = 0x70003666, confidence = "low", note = "the knockback its attack puts on" } } }
