# A ward's own data names nothing it keeps off: its description names the kind, and these name the classes the
# install's effects of that kind are in (or, for a kind with no class of its own, the effects). A world with no
# ward rows has the server's own, which are the first six here.

[[effect_rule]]
effect = 0x6F002672
ward = { classes = [48, 1119, 5013], chance = 0.15 }
prov = { from = "dat", record = 0x6F002672, confidence = "low", note = "the kind and the chance its description gives", fields = { ward = { from = "dat", record = 0x70001F48, confidence = "low", note = "the classes the install's protection from fire names" } } }

