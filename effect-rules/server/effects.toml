# The ward a stone's quest puts on against the warath's knockback: the one effect their attacks put on that throws
# its target back, whose class is no class of its own. Nothing a server does yet throws a player back.
[[effect_rule]]
effect = 0x6F000E95
ward = { effects = [0x700006C6], chance = 1.0 }
prov = { from = "dat", record = 0x6F000E95, confidence = "low", note = "the kind its description gives, always", fields = { ward = { from = "dat", record = 0x70003666, confidence = "low", note = "the knockback its attack puts on" } } }

