# How often creatures of each AI class (their template's AI superclass) play an idle behavior at rest, as the 2017
# recordings show them: the mean gap in seconds, from creatures at rest within 50 m of the recorded player, their
# time before any fight less its last 10 s (a creature about to fight plays one then). Classes seen at least 1.5 h.
# A class with no row keeps the server's own gap.

[[ai_class]]
class = 0x06
idle_every = 295
prov = { from = "capture", evidence = "AC2-EVID-WDB-IDLE-RATE-2017", ref = "class 06", confidence = "high", sample = { creatures = 1440, sessions = 93 }, note = "185 idles in 15.17 h" }

