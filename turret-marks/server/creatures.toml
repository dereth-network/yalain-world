# The patrol guards of the base whose turrets these are designate targets for them, as their description says: each
# puts the mark on a player as it comes within the guard's perception (its own template's, 10 m or 15 m), saying its
# line for the player's race aloud; it marks the player anew only once it has left and come back. In January 2017
# three of these guards named each of six players as they came within 10 m, the mark's record added in the same tick
# as the line. The mark lasts four hours and goes at logout and at a teleport, as its own data says. Its description
# makes the turrets' class hate its holder; the turrets, which never attack first, take on only those: in the one
# recorded visit 159 of 159 of their shots at players came after a guard had named that player, and none fell in 2,329
# seconds of unmarked players within 60 m of them.

[[concealing]]
effect = 0x6F001F31
class = 0x75
regard = "hates"
prov = { from = "dat", record = 0x6F001F31, confidence = "high", note = "its description makes its holder a designated target for the turrets, whose class this is and no other creature's" }

[[creature]]
template = 0x47002C40
only_hated = true
prov = { from = "dat", record = 0x47002C40, confidence = "high", note = "the turret never attacks first and is of the class the mark makes hate its holder; in 2017 it shot only players a guard had marked" }

