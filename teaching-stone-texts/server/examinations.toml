# These stones' templates name nothing: their scripts name them from string tables of their own, which the install's
# list of file names (empty on the relaunched game) can't find. The 2017 servers' examinations of each gave the name and
# the page from one table, the same two strings for every stone.

[[examination]]
template = 0x47002E4D
name = { table = 0x25001AAE, string = 0xA8607CEC }
description = { table = 0x25001AAE, string = 0x6C459364 }
prov = { from = "capture", evidence = "AC2-EVID-WDB-EXAMINATIONS-2017", ref = "template 0x47002E4D", confidence = "high" }

